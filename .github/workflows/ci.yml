name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nwos
          POSTGRES_PASSWORD: nwos
          POSTGRES_DB: nwos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nwos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nwos:nwos@localhost:5432/nwos_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate (checks migrations apply to a clean database)
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://nwos:nwos@localhost:5432/nwos_test

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
